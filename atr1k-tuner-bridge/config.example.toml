# config.example.toml — configuration for atr1k-tuner-bridge (ATR-1000 ATU → MQTT bridge).
# Default location: /etc/atr1k-tuner-bridge/config.toml
# Override with: atr1k-tuner-bridge -config /path/to/config.toml
#
# All values shown are the built-in defaults used when this file is absent.
# Only include the keys you want to change.
#
# The MQTT password is NOT kept here — it is loaded from the
# ATR1K_TUNER_BRIDGE_MQTT_PASSWORD environment variable (systemd EnvironmentFile
# /etc/atr1k-tuner-bridge/atr1k-tuner-bridge.env, 0600), so it never appears in the
# TOML, the unit file, or the process command line.
# See ../docs/conventions/config-and-secrets.md.

# host is the compute node this adapter runs on (published in /meta, model §8.1).
host = "shari"

[tuner]
# ATR-1000 (BTR-1000 / N7DDC family) binary WebSocket endpoint. The ATU streams
# meter (SWR / forward power) and relay (L/C) frames and accepts tune-status /
# tune-mode commands over this socket.
url = "ws://192.168.1.20:60001"

[device]
# Identity published in /meta. link reflects the transport to the ATU.
model = "ATR-1000"
link  = "wifi"

[mqtt]
broker           = "tcp://127.0.0.1:1883"
# client_id defaults to "<site>-<station>-<slot>" (model §8) when empty.
client_id        = ""
# Station-model slot addressing: <site>/<station>/<slot>/{meta,state,status,cmd}
site             = "muehle"
station          = "hf"
slot             = "tuner"
location         = "bauwagen"   # physical location label, published in /meta
# Home Assistant discovery is rendered by the standalone hadiscovery consumer
# from this bridge's expose block in /meta (model §9) — no embedded discovery.
user             = "hf"
# password is loaded from ATR1K_TUNER_BRIDGE_MQTT_PASSWORD (EnvironmentFile), not here.
password         = ""

[log]
# debug | info | warn | error
level = "info"

# --- env overrides (systemd EnvironmentFile) ---------------------------------
# These ATR1K_TUNER_BRIDGE_* env vars overlay the [mqtt]/[tuner] sections above
# and are used by deploy.sh so the secret never sits in the TOML:
#   ATR1K_TUNER_BRIDGE_MQTT_BROKER      ATR1K_TUNER_BRIDGE_MQTT_CLIENT_ID
#   ATR1K_TUNER_BRIDGE_MQTT_USER        ATR1K_TUNER_BRIDGE_MQTT_PASSWORD   (EnvironmentFile)
#   ATR1K_TUNER_BRIDGE_MQTT_SITE        ATR1K_TUNER_BRIDGE_MQTT_STATION    ATR1K_TUNER_BRIDGE_MQTT_SLOT
#   ATR1K_TUNER_BRIDGE_TUNER_URL