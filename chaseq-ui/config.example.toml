# chaseq-ui config. Copy to config.toml next to chaseq-ui.exe (C:\Users\iotte\chaseq-ui\).
# The MQTT password goes in [mqtt] below (this file stays on bwpc; deploy.sh copies it once).

filters_file = "filters.json"   # view filters, relative to this file

[mqtt]
broker    = "tcp://192.168.1.178:1883"   # the scmino station broker
user      = "hf"
password  = ""                           # the hf broker password
client_id = "muehle-chaseq-ui"

[topics]
site     = "muehle"
station  = "hf"
chase    = "chase"      # chase-queue slot
radio    = "radio"      # flexbridge slot

[http]
listen = "127.0.0.1:8480"

[loggers]
# Where the callsign is sent: one [[loggers.sender]] per logger. kind "log4om" =
# Log4OM Settings -> Connections -> Remote Control Interface; addr is its inbound
# UDP port (2241 is the usual default; check it there). timeout = reply wait
# (default 500ms); enabled = false switches an entry off (default true).
[[loggers.sender]]
kind    = "log4om"
addr    = "127.0.0.1:2241"
timeout = "500ms"
enabled = true

# Older configs with only these two keys still work; they are used when there is
# no [[loggers.sender]] entry at all.
# log4om_addr    = "127.0.0.1:2241"
# log4om_timeout = "500ms"

[log]
file = "chaseq-ui.log"   # a windowsgui exe has no stderr
