; platformio.ini — M5 Stamp PLC #1 firmware (m5stamp-hf-ctrl)
;
; Compound embedded node: one M5 Stamp PLC (StamPLC K141, ESP32-S3 + AW9523B
; expander @0x59 for 4 relays / 8 DIs) publishes two station slots —
; muehle/hf/switch (PA+TRX remote-on relays) and muehle/hf/pa-arm (arm relay 1
; with embedded safety logic). See CLAUDE.md and docs/m5stamp-hf-ctrl-mqtt-api.md.
;
; Build:    pio run                (or: pio run -t upload)
; Monitor:  pio device monitor
; This project uses PlatformIO, NOT the meta-repo's systemd/deploy conventions
; (those are for the Go services on shari). Secrets live in gitignored
; src/secrets.h (copy from src/secrets.example.h).

[platformio]
default_envs = m5stamp-plc1

[env:m5stamp-plc1]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  m5stack/M5StamPLC @ ^1.0
  m5stack/M5Unified @ ^0.2
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0

;_partitions = default.csv