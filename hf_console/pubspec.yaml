name: hf_console
description: Mühle HF station operations console for Android and iOS
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.11.11
  flutter_secure_storage: ^11.0.0
  provider: ^6.1.5+1
  clock: ^1.1.2
  shared_preferences: ^2.5.5
  typed_data: ^1.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/geo/
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Gemini_Generated_Image_n0qlmmn0qlmmn0ql.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/Gemini_Generated_Image_n0qlmmn0qlmmn0ql.jpg"

  fonts:
    - family: SairaCondensed
      fonts:
        - asset: assets/fonts/SairaCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/SairaCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SairaCondensed-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
