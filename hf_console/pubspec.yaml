name: hf_console
description: Mühle HF station operations console for Android tablet
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.11.11
  flutter_secure_storage: ^11.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  typed_data: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/

  fonts:
    - family: SairaCondensed
      fonts:
        - asset: assets/fonts/SairaCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/SairaCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SairaCondensed-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
