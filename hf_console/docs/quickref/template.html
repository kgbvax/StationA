<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>hf_console quick reference</title>
<!--
  Template for hf-console-quickref.html. Do not edit the generated file:
  edit this template or the call-outs in test/tool/quickref_sheets.dart, then
  run docs/quickref/build.sh. The render test replaces the data slot below
  with {sheets:[{id,title,purpose,width,height,image,callouts:[{title,text,rect:[x,y,w,h],marker?}]}]};
  rects are in logical screenshot pixels (the image itself is rendered at 2x),
  a zero-size rect is a point.
  Layout: numbered markers on the screenshot, the legend underneath.
-->
<style>
  @page { size: A4 landscape; margin: 0; }
  :root {
    --paper: #F4F3EF; --ink: #1A1A1A; --mute: #5E5A53; --faint: #8C887E; --rule: #D4D1CA;
    --co: #D6247F;            /* call-out colour: one the console itself does not use */
    --cyan: #5FB2C9; --green: #5CCB8A; --amber: #D7B04A; --red: #D9685C;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", Menlo, monospace;
    --cond: "Saira Condensed", "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #8a8a8a; }
  body { font-family: var(--sans); color: var(--ink); padding: 12mm 0 0; }
  .sheet {
    width: 297mm; height: 210mm; margin: 0 auto 12mm; background: var(--paper);
    padding: 8mm 10mm 7mm; display: flex; flex-direction: column; position: relative; overflow: hidden;
    break-after: page; box-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .sheet:last-child { break-after: auto; }
  @media print {
    html, body { background: var(--paper); padding: 0; }
    .sheet { margin: 0; box-shadow: none; }
  }
  header { display: flex; align-items: baseline; gap: 6mm; border-bottom: 0.6mm solid var(--ink); padding-bottom: 1.6mm; }
  header h1 { font: 600 20pt/1 var(--cond); letter-spacing: .04em; margin: 0; text-transform: uppercase; }
  header .purpose { font-size: 10pt; color: var(--mute); flex: 1; }
  header .tag { font: 8pt var(--mono); color: var(--faint); text-align: right; }
  main { flex: 1; position: relative; min-height: 0; margin: 3mm 0 2.5mm; }
  footer { border-top: 0.3mm solid var(--rule); padding-top: 1.6mm; font: 7.5pt var(--mono); color: var(--mute); }
  footer .note { font: italic 8.5pt var(--sans); color: var(--ink); margin-bottom: 1.2mm; }
  footer .row { display: flex; gap: 5mm; align-items: center; }
  footer .key { display: flex; gap: 4mm; flex: 1; }
  footer .sw { display: inline-block; width: 3mm; height: 3mm; margin-right: 1.2mm; vertical-align: -0.4mm; border-radius: .5mm; }
  .shot { position: absolute; }
  .shot img { display: block; width: 100%; height: 100%; border: 0.3mm solid #000; }
  svg.over { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .legend { position: absolute; display: grid; column-gap: 6mm; row-gap: 2mm; align-items: start; }
  .legend .item { display: grid; grid-template-columns: 5.2mm 1fr; column-gap: 1.8mm; font-size: 8.2pt; line-height: 1.25; }
  .legend .item b { font: 600 8.2pt var(--mono); letter-spacing: .02em; }
  .legend .item > div > span { color: var(--mute); }
  .num { display: inline-flex; align-items: center; justify-content: center; width: 5.2mm; height: 5.2mm; border-radius: 50%;
         background: var(--co); color: #fff; font: 700 8pt var(--mono); }
  .missing { font: 12pt var(--mono); padding: 20mm; }
</style>
</head>
<body>
<script>
const DATA = /*QUICKREF_DATA*/null;
const MM = 96 / 25.4;        // CSS px per mm
const SPLIT = 748;           // screenshot x: the console's left pane ends here
const FOOT = `<div class="note">Everything that is not specifically labeled does what you think it does™</div>
  <div class="row"><div class="key">
    <span><i class="sw" style="background:var(--cyan)"></i>cyan = active / selected</span>
    <span><i class="sw" style="background:var(--green)"></i>green = healthy</span>
    <span><i class="sw" style="background:var(--amber)"></i>amber = attention / hold</span>
    <span><i class="sw" style="background:var(--red)"></i>red = danger · TX · offline</span></div>
    <span>Mühle station · tablet layout · scmino:8091</span></div>`;

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }

// Reading order: the left pane top to bottom, then the right rail.
function ordered(callouts) {
  const left = c => c.rect[0] + c.rect[2] / 2 < SPLIT;
  const key = c => [left(c) ? 0 : 1, c.rect[1] + c.rect[3] / 2, c.rect[0]];
  return [...callouts].sort((a, b) => {
    const ka = key(a), kb = key(b);
    return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2];
  });
}

function renderSheet(sheet, n, total) {
  document.body.insertAdjacentHTML("beforeend", `<section class="sheet" id="${sheet.id}">
    <header><h1>${esc(sheet.title)}</h1><div class="purpose">${esc(sheet.purpose)}</div>
      <div class="tag">hf_console quick reference<br>${n} / ${total}</div></header>
    <main></main>
    <footer>${FOOT}</footer></section>`);
  const main = document.getElementById(sheet.id).querySelector("main");
  const r = main.getBoundingClientRect();
  const W = sheet.width, H = sheet.height;
  const cos = ordered(sheet.callouts);
  const gap = 3 * MM;

  // Legend first (to measure it): up to four columns under the screenshot.
  let legend = null, lh = 0;
  if (cos.length) {
    const cols = Math.min(4, cos.length);
    main.insertAdjacentHTML("beforeend", `<div class="legend" style="grid-template-columns:repeat(${cols},1fr)">` +
      cos.map((c, i) => `<div class="item"><span class="num">${i + 1}</span><div><b>${esc(c.title)}</b><br><span>${esc(c.text)}</span></div></div>`).join("") +
      `</div>`);
    legend = main.lastElementChild;
  }
  // The screenshot takes what is left; the legend is as wide as the shot,
  // and a narrower legend may grow taller, so settle in a few passes.
  let sw = r.width, sh = sw * H / W;
  for (let pass = 0; pass < 3; pass++) {
    if (legend) {
      legend.style.width = `${sw}px`;
      lh = legend.getBoundingClientRect().height;
    }
    const room = r.height - (legend ? lh + gap : 0);
    sh = Math.min(room, r.width * H / W);
    sw = sh * W / H;
  }
  const ox = (r.width - sw) / 2, oy = 0, s = sw / W;
  if (legend) { legend.style.left = `${ox}px`; legend.style.top = `${sh + gap}px`; }
  main.insertAdjacentHTML("afterbegin",
    `<div class="shot" style="left:${ox}px;top:${oy}px;width:${sw}px;height:${sh}px"><img src="${sheet.image}" alt="${esc(sheet.title)} screenshot"></div><svg class="over"></svg>`);
  const svg = main.querySelector("svg");

  const R = 2.7 * MM;                                  // marker radius
  const inShot = (x, y) => x - R >= ox && x + R <= ox + sw && y - R >= oy && y + R <= oy + sh;
  const boxes = cos.map(c => {
    const [x, y, w, h] = c.rect;
    return { x: ox + x * s, y: oy + y * s, w: w * s, h: h * s };
  });
  const placed = [];
  // A marker disc may not cover another call-out's box or another marker.
  const free = (x, y, self) =>
    inShot(x, y) &&
    boxes.every((b, j) => j === self || b.w === 0 ||
      x + R < b.x - 2 || x - R > b.x + b.w + 2 || y + R < b.y - 2 || y - R > b.y + b.h + 2) &&
    placed.every(p => Math.hypot(p[0] - x, p[1] - y) > 2 * R + 2);
  const marks = [];
  cos.forEach((c, i) => {
    const b = boxes[i];
    let px, py;
    if (b.w === 0) {
      // A point: a dot on it, the marker just above-right with a short tick.
      const tries = [[4, -4], [-4, -4], [4, 4], [-4, 4]].map(([dx, dy]) => [b.x + dx * MM, b.y + dy * MM]);
      [px, py] = tries.find(([x, y]) => free(x, y, i)) || tries[0];
      svg.insertAdjacentHTML("beforeend",
        `<line x1="${b.x}" y1="${b.y}" x2="${px}" y2="${py}" stroke="var(--co)" stroke-width="1.4"/>` +
        `<circle cx="${b.x}" cy="${b.y}" r="3.2" fill="var(--co)" stroke="#fff" stroke-width="1"/>`);
    } else {
      svg.insertAdjacentHTML("beforeend",
        `<rect x="${b.x - 1.5}" y="${b.y - 1.5}" width="${b.w + 3}" height="${b.h + 3}" rx="2" fill="none" stroke="var(--co)" stroke-width="1.6"/>`);
      // Beside the box, never on what it marks: left, right, above, below,
      // then the top-left corner as the last resort.
      const cy = b.y + b.h / 2, g = R + 2.5;
      const side = { left: [b.x - g, cy], right: [b.x + b.w + g, cy], above: [b.x + R, b.y - g], below: [b.x + R, b.y + b.h + g] };
      const tries = [side[c.marker], side.left, side.right, side.above, side.below,
                     [b.x + b.w - R, b.y - g], [b.x + b.w - R, b.y + b.h + g]].filter(Boolean);
      [px, py] = tries.find(([x, y]) => free(x, y, i)) || [Math.max(b.x, ox + R + 1), Math.max(b.y, oy + R + 1)];
    }
    placed.push([px, py]);
    marks.push(`<g><circle cx="${px}" cy="${py}" r="${R}" fill="var(--co)" stroke="#fff" stroke-width="1.4"/>` +
      `<text x="${px}" y="${py + 3.6}" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-weight="700" font-size="10.5" fill="#fff">${i + 1}</text></g>`);
  });
  svg.insertAdjacentHTML("beforeend", marks.join(""));   // markers above every outline
}

if (!DATA) {
  document.body.innerHTML = '<p class="missing">Template only: run docs/quickref/build.sh to render the sheets.</p>';
} else {
  DATA.sheets.forEach((sh, i) => renderSheet(sh, i + 1, DATA.sheets.length));
}
</script>
</body>
</html>
