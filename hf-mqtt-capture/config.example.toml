# hf-mqtt-capture configuration
#
# On the target this lives at /etc/hf-mqtt-capture/config.toml (0600, owned by the
# service user). See docs/conventions/config-and-secrets.md.

broker   = "tcp://127.0.0.1:1883"
user     = "hf"
password = ""               # set on the device; never on the command line
site     = "muehle"
station  = "hf"             # captures site/station/# (e.g. muehle/hf/#)
log_dir  = "/var/log/hf-mqtt-capture"
retention_hours = 72        # keep the last 72 hours of hourly log files
