; platformio.ini — M5Stack Dial HF-rotator control head firmware (m5dial-hf-rotctrl)
;
; An M5Stack Dial (ESP32-S3FN8, 1.28" round GC9A01 240x240 display, rotary
; encoder with push, FT3267 touch, buzzer) acting as a physical control head
; for the HF rotator slot (muehle/hf/rotator). It is a consumer + /cmd
; stimulator, NOT a slot (integration model / PRD R1.6): no /meta, /state,
; /status of its own, no LWT. See CLAUDE.md and
; docs/m5dial-hf-rotctrl-mqtt-api.md.
;
; Build:    pio run                (or: pio run -t upload)
; Monitor:  pio device monitor
; This project uses PlatformIO, NOT the meta-repo's systemd/deploy conventions
; (those are for the Go services on shari). Secrets live in gitignored
; src/secrets.h (copy from src/secrets.example.h.x).
;
; Wireless OTA is wired into the very first image (ArduinoOTA in main.cpp),
; so only the FIRST flash (or recovery) needs USB. Routine updates go over
; the network: ./deploy.sh ota (default host m5dial-rotctrl-1.local).
; The SIM_MODE env below is the one exception — a sim image has no radio,
; so USB is the only way in and the only way back to the live image.

[platformio]
default_envs = m5dial-rotctrl1

[env:m5dial-rotctrl1]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
; Default environment: USB/serial first flash and recovery.
upload_protocol = esptool
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  ; The Dial's USB connector is the S3's native USB. Without CDC_ON_BOOT,
  ; Serial maps to UART0 (GPIO43/44 — unconnected pins on this board) and
  ; every log line goes into the void; the ROM banner is the only thing a
  ; host ever sees. With USB_MODE=1 + CDC_ON_BOOT=1, Serial is the hardware
  ; USB-Serial-JTAG and pio device monitor actually works.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  m5stack/M5Dial @ ^1.0
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0

[env:m5dial-rotctrl1-ota]
; Over-the-air update environment. Requires the Dial to be reachable at
; m5dial-rotctrl-1.local (ArduinoOTA hostname set to DEVICE_SERIAL in
; src/main.cpp). ./deploy.sh wraps this; no-arg ./deploy.sh defaults here.
; The firmware demands an OTA password (ArduinoOTA.setPassword in
; main.cpp), so espota must present it: deploy.sh exports it from
; src/secrets.h into DIAL_OTA_PASSWORD — the password never lands in this
; file (checked in) or on the deploy.sh command line.
extends         = env:m5dial-rotctrl1
upload_protocol = espota
upload_port     = m5dial-rotctrl-1.local
upload_flags    = --auth=${sysenv.DIAL_OTA_PASSWORD}

[env:m5dial-rotctrl1-sim]
; Desk-development build: SIM_MODE=1 replaces the station side of the wire
; with the local mast model in src/sim.h — no WiFi, no MQTT, no OTA. It is
; flashed over USB ONLY (./deploy.sh sim): a sim image has no OTA listener
; (and no radio), so getting back to the live image is a USB flash too.
; The sim runs the production face/knob/coalescer/re-baseline code against a
; model that slews at the real G-450DC rate (see src/config.h).
extends      = env:m5dial-rotctrl1
build_flags  = ${env:m5dial-rotctrl1.build_flags} -DSIM_MODE=1