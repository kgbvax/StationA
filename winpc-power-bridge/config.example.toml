# winpc-power-bridge configuration — seed-once (deploy.sh copies it to the
# shack PC only if no config.toml exists there; the PC owns it afterwards).
#
# The MQTT password is NOT meant to be here: set the user environment variable
# WINPC_POWER_BRIDGE_MQTT_PASSWORD on the shack PC (see CLAUDE.md). The
# [mqtt] password key is only a fallback; the file lives in the user profile,
# which only the user, SYSTEM and Administrators can read.
# Missing keys fall back to the built-in defaults shown below.

host     = "bwpc"       # compute node, published in /meta
location = "bauwagen"   # physical location, published in /meta

[mqtt]
broker    = "tcp://192.168.1.178:1883"  # station broker (scmino)
client_id = ""                          # default: muehle-power-shack-pc
user      = "hf"
password  = ""                          # fallback only; env WINPC_POWER_BRIDGE_MQTT_PASSWORD wins
site      = "muehle"
station   = "power"
slot      = "shack-pc"

[device]
model  = "Windows PC"
serial = ""            # default: host
link   = "ethernet"

[sleep]
# A sleep /cmd is refused when the last keyboard/mouse input in the user
# session is newer than this. Minimum 1.
min_user_idle_minutes = 30

[state]
interval_s = 30        # /state refresh (user_idle_s); minimum 5

[tailscale]
# After the PC resumed from sleep (Modern Standby too), Windows has paused
# Tailscale, and a remote computer often cannot open a tunnel to this PC.
# The agent then runs `tailscale ping --tsmp` to every online peer, which
# opens the tunnels from this side. A missing program is logged once per
# resume and does nothing else.
ping_after_resume = true
path = 'C:\Program Files\Tailscale\tailscale.exe'

# ---------------------------------------------------------------------------
# Programs for /cmd ensure_program and stop_program (value = name). The agent
# uses a copy that already runs, and it never ends a copy that it did not
# start itself. The copies it started are recorded (PID and process start
# time) in programs-owned.json next to this file.
#
#   name            id on the bus: lower case letters, digits, _ (required)
#   exe             full path of the program file (required)
#   args            command line arguments (default none)
#   workdir         working directory (default: the directory of exe)
#   process         image name in the process list (default: file name of exe)
#   check           ready check (required):
#                     process  the process still runs settle_s after a start
#                     tcp      connect to check_address, send probe, the first
#                              reply line must match reply_pattern; after a
#                              start, tried again until check_timeout_s
#                     none     ready as soon as it is started
#   settle_s        default 5
#   check_timeout_s default 60
#   restart_owned   end and start again a copy that the agent started, on
#                   every ensure_program (default false). A copy that the
#                   operator started is never restarted.
#
# Example for the 75auto start chain (paths are placeholders, set them on the PC):
#
# [[program]]
# name          = "aethersdr"
# exe           = 'C:\Program Files\AetherSDR\AetherSDR.exe'
# check         = "tcp"
# check_address = "127.0.0.1:4532"   # its rigctl port, as in the 75auto config
# probe         = "f"                # rigctl: get frequency
# reply_pattern = '^[0-9]+$'         # "RPRT -1" = no radio connection
# check_timeout_s = 90
#
# [[program]]
# name          = "wsjtx"
# exe           = 'C:\WSJT\wsjtx\bin\wsjtx.exe'
# check         = "process"          # 75auto binds UDP 2237 at session start
# restart_owned = true
#
# [[program]]
# name          = "75auto"
# exe           = 'C:\Users\iotte\75auto\75auto.exe'
# check         = "none"             # powerseq waits for the 75auto /status
# ---------------------------------------------------------------------------

[log]
level = "info"         # debug | info | warn | error
# Windows exception to the logging convention: the agent runs hidden (no
# console), so stderr goes nowhere. Relative paths resolve against this
# file's directory. Moved to <file>.1 at start when above 5 MB. "" = stderr.
file  = "winpc-power-bridge.log"
