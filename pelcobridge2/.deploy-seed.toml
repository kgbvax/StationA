# pelcobridge2 configuration — seed-once, store 0600.
# The MQTT password is NOT here: export PELCOBRIDGE2_MQTT_PASSWORD instead.
# Missing keys fall back to the built-in defaults shown below.

[serial]
# Shack PC 2026-08-30: two Silicon Labs CP210x bridges (COM5, COM6) — COM5 is
# the first guess for the RS-485 adapter; VERIFY at the bench (wrong port =
# silent line, harmless: swap to COM6 in this file's remote twin).
port   = "COM5"
baud   = 2400     # bench link is 2400 8N1
addr   = 1        # head's Pelco DIP address

[rotctld]
enabled = true
bind    = "0.0.0.0"  # 127.0.0.1 to keep rotctl local
port    = 4533

[control]
jog_speed              = 18     # 0x12, Pelco default; 0x00–0x3F
settle_ms              = 2000   # quiet-line window around absolute sets
set_tolerance_deg      = 0.3
arm_max_readback_age_s = 10     # pan readback must be fresher to arm
jog_hold_ms            = 250    # TUI hold-to-move stop timer
crawl                  = false  # gotos converge by 1 s low-speed jog bursts instead of absolute sets
crawl_speed            = 4      # 0x04; crawl jog speed byte 1–0x3F (0 = unset sentinel → default 4)
crawl_tolerance_deg    = 4.0    # crawl "finished" tolerance
min_az = 0.0
max_az = 360.0
min_el = 0.0
max_el = 90.0

[mqtt]
enabled      = false
# Shack-local broker per mqtt-topology (LAN clients → shari). Enable only
# after the shari deploy, with PELCOBRIDGE2_MQTT_PASSWORD set in the shell.
broker       = "tcp://192.168.1.139:1883"
client_id    = ""          # default: muehle-uhf-rotator
user         = "hf"
password     = ""          # unused; env PELCOBRIDGE2_MQTT_PASSWORD wins
site         = "muehle"
station      = "uhf"
slot         = "rotator"
device_model = "PTS-303Z/3050DZ"
device_name  = "UHF Rotator"
device_link  = "rs485"
host         = "shack-pc"

[log]
file = ""   # optional log file; empty disables