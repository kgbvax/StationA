# config.example.toml — configuration for powerseq (the station startup/shutdown
# sequencer). Default location: /etc/powerseq/config.toml
# Override with: powerseq -config /path/to/config.toml
#
# powerseq is a logic slot (no device) implementing the `sequencer` role
# (integration model §4, §7.1). On the operator one-button /cmd (start|stop, NOT
# retained) it runs an ordered startup/shutdown over the controlled slots'
# retained /cmd with delays and liveness confirmations. It is one writer but
# does not lock the channels — they stay directly toggleable while idle.
#
# The sequence is CONFIG-DRIVEN: the [[startup]] and [[shutdown]] step lists
# below define it, not Go code. Edit them to change the order, targets, waits,
# or delays for a different setup. This file ships the integration-model §7.1
# sequence as the default.
#
# Only include the keys you want to change; the transport + timing defaults
# below are baked in when this file is absent.
#
# The MQTT password is NOT kept here — it is loaded from the
# POWERSEQ_MQTT_PASSWORD environment variable (systemd EnvironmentFile
# /etc/powerseq/powerseq.env, 0600), so it never appears in the TOML, the unit
# file, or the process command line.
# See ../docs/conventions/config-and-secrets.md.

# host is the compute node this service runs on (published in /meta, model §8.1).
host = "shari"
# location is a physical label published in /meta.
location = "bauwagen"

[mqtt]
broker = "tcp://127.0.0.1:1883"
# client_id defaults to "<site>-<station>-<slot>" (model §8) when empty.
client_id = ""
# The sequencer's OWN address: <site>/<station>/<slot>/{meta,state,status,cmd}.
site = "muehle"
station = "hf"
slot = "power-seq"
# Home Assistant discovery is rendered by the standalone hadiscovery consumer
# from this slot's expose block in /meta (model §9) — no embedded discovery.
discovery_prefix = "homeassistant"
user = "hf"
# password is loaded from POWERSEQ_MQTT_PASSWORD (EnvironmentFile), not here.
password = ""

[timing]
# Pause referenced by delay steps with duration = "network" — let the network
# (the broker, the Shelies' WiFi) come up after the station master mains. ~30 s.
network_delay_s = 30
# DEFAULT deadline for every wait step (overridden by a step's timeout_s). Max
# wait for a liveness confirmation before the step (and the sequence) faults.
step_timeout_s = 120
# Pause referenced by delay steps with duration = "stagger" — between shutdown
# steps for inrush control.
shutdown_stagger_s = 2
# How often the runner re-checks a wait condition (ms).
poll_interval_ms = 200
# Default hold (debounce) window for a wait step that omits hold_ms — the
# condition must hold continuously this long. 0 = pass as soon as true.
default_hold_ms = 0

[log]
# debug | info | warn | error
level = "info"

# --- step schema --------------------------------------------------------------
# Each [[startup]] / [[shutdown]] entry is ONE step. Steps run in array order.
# A step has: name (string, REQUIRED, unique within its array) + kind + kind keys.
# `kind` is the discriminator:
#
#   kind = "cmd"          emit a retained /cmd to a site-relative slot.
#     slot   = "hf/switch"        # site-relative → <site>/<slot>/cmd
#     action = "set_power"        # /cmd JSON "action"
#     value  = "on"               # /cmd JSON "value" (ALWAYS a string — the
#                                 # value-key convention; model value_type is
#                                 # string|int|float, NO bool)
#     retain = true               # optional, default true (controlled /cmd
#                                 # retained, model §8)
#
#   kind = "wait_status"  wait until every listed slot's /status == state.
#     slots     = ["hf/switch", "hf/pa-arm"]   # site-relative; logical AND;
#                                             # every entry must be non-empty
#     state     = "online"                     # optional, default "online";
#                                             # "offline" confirms a slot went
#                                             # down (an actual offline payload,
#                                             # not absence)
#     hold_ms   = 500            # optional: omitted → default_hold_ms; an
#                                # EXPLICIT 0 = edge-triggered even when a
#                                # default hold is set
#     timeout_s = 60             # optional: per-step override of step_timeout_s;
#                                 # must be > 0 if given
#
#   kind = "wait_state"   wait until a slot's /state top-level field == value.
#     slot      = "hf/pa"        # site-relative
#     field     = "power"        # top-level JSON key in the /state snapshot
#     value     = "on"           # string; observed JSON coerced to string. May
#                                # be "" — then the wait passes when the field
#                                # is absent/nil/empty (wait for a field to clear)
#     hold_ms   = 500            # optional (see wait_status)
#     timeout_s = 60            # optional, must be > 0 if given
#     # IMPLICIT liveness precondition (two layers): the slot's /status MUST be
#     # online, AND its /state.device_online must not be "false" when present —
#     # so neither a dead bridge (LWT) nor a dead device behind a live bridge
#     # passes on a stale retained /state. If a wait times out unexpectedly,
#     # check both layers; the fault string does not say which one blocked.
#     # A malformed /state drops the slot's prior snapshot (no stale poisoning).
#     # A wait_state on the sequencer's OWN slot is a config error.
#
#   kind = "delay"        sleep a fixed duration.
#     duration_s = 30                       # literal seconds (integer, > 0)
#     # OR
#     duration  = "network" | "stagger"      # symbolic ref into [timing]
#     # exactly one of duration_s / duration; unknown symbolic value → load
#     # error; a non-positive duration_s → load error (no silent no-op).
#
#   kind = "wol"          send a Wake-on-LAN magic packet (UDP).
#     mac       = "aa:bb:cc:dd:ee:ff"     # target NIC MAC (REQUIRED, valid)
#     broadcast = "192.168.1.255:9"       # optional host:port, default
#                                         # 255.255.255.255:9 (prefer the
#                                         # subnet broadcast on a multi-NIC host)
#
# Phase transitions are implicit: entering the first startup step → phase=
# starting; completing the last → running. Entering the first shutdown step →
# stopping; completing the last → idle. A wait timeout → phase=idle, fault=
# "<step>: <reason>", NO rollback (driven slots hold their last retained /cmd).
#
# Idle standby (optional — omit [[standby]], [[wake]] and [idle] to disable):
# from phase=running, when [idle].activity_slot reports activity="inactive",
# no [[idle.watch]] moved for timeout_minutes, and running has lasted at least
# timeout_minutes → [[standby]] runs (phase entering_standby → standby). In
# standby, a last_activity newer than the standby entry, a watch moving, or a
# `start` cmd → [[wake]] runs (phase waking → running). `stop` works from
# standby. A fault in either list → phase=idle + fault, like startup.

# --- idle standby triggers ----------------------------------------------------
[idle]
# antenna-select grounds the antenna after its own idle timeout (no VFO change,
# no TX, no operator hold) and publishes /state.activity + last_activity.
activity_slot = "hf/antenna-select"
# Quiet window for the watches below, and the minimum time in phase=running
# before standby (so a start/wake is not followed by an instant standby).
timeout_minutes = 30

# UHF use counts as activity too: the antenna-power plug also feeds the UHF
# rotators, and the shack PC runs the satellite tracker. A watch is a /state
# field; a change of at least min_delta (numeric) since the last counted value
# is activity. Changes while the slot is offline / device_online=false, or a
# field appearing/vanishing, are not activity.
[[idle.watch]]
slot = "uhf/radio"
field = "freq_hz"

[[idle.watch]]
slot = "uhf/az-rotator"
field = "az"
min_delta = 2.0

[[idle.watch]]
# el readback dithers 0↔1° at the lower stop (ADC noise) — the deadband keeps
# that from reading as activity.
slot = "uhf/el-rotator"
field = "el"
min_delta = 2.0

# --- startup ------------------------------------------------------------------
# 1. Energize station master mains.
[[startup]]
name = "master-on"
kind = "cmd"
slot = "power/master"
action = "set_power"
value = "on"

# 2. Network settle delay (~30 s, from [timing].network_delay_s).
[[startup]]
name = "network-delay"
kind = "delay"
duration = "network"

# 3. Energize the TRX PSU (13.8 V, site-level; feeds HF + UHF and the PLC).
[[startup]]
name = "psu-on"
kind = "cmd"
slot = "power/psu-13v8"
action = "set_power"
value = "on"

# 4. Let the PSU settle.
[[startup]]
name = "psu-settle"
kind = "delay"
duration_s = 5

# 5. Guard: the PLC (hf/switch) must be online before the remote-on relays are
#    commanded. hf/switch/cmd is ONE retained topic — if set_trx and set_pa
#    were both published while the PLC is still booting, the broker would keep
#    only set_pa and the TRX would never switch on. Passes at once when the PLC
#    is already up.
[[startup]]
name = "wait-plc-online"
kind = "wait_status"
slots = ["hf/switch"]

# 6. Power on the TRX (FLEX-8400) via the PLC remote-on relay.
[[startup]]
name = "trx-on"
kind = "cmd"
slot = "hf/switch"
action = "set_trx"
value = "on"

# 7. 1 s between TRX and PA remote-on.
[[startup]]
name = "trx-settle"
kind = "delay"
duration_s = 1

# 8. Power on the PA via the PLC remote-on relay.
[[startup]]
name = "pa-on"
kind = "cmd"
slot = "hf/switch"
action = "set_pa"
value = "on"

# 9. Antenna power: HF + UHF rotators and the Ultrabeam RCU-06.
[[startup]]
name = "antennas-on"
kind = "cmd"
slot = "power/antennas"
action = "set_power"
value = "on"

# 10. Wait for the radio to come online after TRX power-on.
[[startup]]
name = "wait-radio-online"
kind = "wait_status"
slots = ["hf/radio"]

# 11. Wait for the PA to report power on (state.power == "on"). The implicit
#     two-layer liveness precondition means a dead bridge (LWT) or a dead PA
#     behind a live bridge cannot pass on stale /state.
[[startup]]
name = "wait-pa-power-on"
kind = "wait_state"
slot = "hf/pa"
field = "power"
value = "on"

# 12. Arm the PA (permit RF). Last startup step → phase=running.
[[startup]]
name = "pa-arm-enable"
kind = "cmd"
slot = "hf/pa-arm"
action = "set_enabled"
value = "true"

# --- shutdown (reverse, short staggers for inrush) ----------------------------
[[shutdown]]
name = "pa-arm-disable"
kind = "cmd"
slot = "hf/pa-arm"
action = "set_enabled"
value = "false"

[[shutdown]]
name = "stagger-1"
kind = "delay"
duration = "stagger"

[[shutdown]]
name = "antennas-off"
kind = "cmd"
slot = "power/antennas"
action = "set_power"
value = "off"

[[shutdown]]
name = "stagger-2"
kind = "delay"
duration = "stagger"

[[shutdown]]
name = "pa-off"
kind = "cmd"
slot = "hf/switch"
action = "set_pa"
value = "off"

[[shutdown]]
name = "stagger-3"
kind = "delay"
duration = "stagger"

[[shutdown]]
name = "trx-off"
kind = "cmd"
slot = "hf/switch"
action = "set_trx"
value = "off"

[[shutdown]]
name = "stagger-4"
kind = "delay"
duration = "stagger"

[[shutdown]]
name = "psu-off"
kind = "cmd"
slot = "power/psu-13v8"
action = "set_power"
value = "off"

[[shutdown]]
name = "stagger-5"
kind = "delay"
duration = "stagger"

[[shutdown]]
name = "master-off"
kind = "cmd"
slot = "power/master"
action = "set_power"
value = "off"

# --- idle standby -------------------------------------------------------------
# antenna-select has already grounded the antenna when this runs.
[[standby]]
name = "antennas-off"
kind = "cmd"
slot = "power/antennas"
action = "set_power"
value = "off"

# Shack PC (bwpc) to sleep. NOT retained: a retained sleep would replay when
# the PC wakes and put it straight back to sleep. The agent on the PC refuses
# while someone is using its keyboard/mouse.
[[standby]]
name = "pc-sleep"
kind = "cmd"
slot = "power/shack-pc"
action = "sleep"
value = "now"
retain = false

# --- wake (antenna-select reconnects the antenna on the same activity) --------
[[wake]]
name = "pc-wake"
kind = "wol"
mac = "00:00:00:00:00:00"    # REPLACE with the bwpc NIC MAC
broadcast = "192.168.1.255:9"

[[wake]]
name = "antennas-on"
kind = "cmd"
slot = "power/antennas"
action = "set_power"
value = "on"

[[wake]]
name = "wait-antenna-gear-online"
kind = "wait_status"
slots = ["hf/ant-ctrl", "hf/rotator"]
timeout_s = 120

# --- env overrides (systemd EnvironmentFile) ---------------------------------
# These POWERSEQ_MQTT_* env vars overlay the [mqtt] section above and are used
# by deploy.sh so the secret never sits in the TOML:
#   POWERSEQ_MQTT_BROKER      POWERSEQ_MQTT_CLIENT_ID
#   POWERSEQ_MQTT_USER        POWERSEQ_MQTT_PASSWORD   (EnvironmentFile)
#   POWERSEQ_MQTT_SITE