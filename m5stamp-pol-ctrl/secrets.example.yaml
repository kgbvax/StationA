# secrets.example.yaml — m5stamp-pol-ctrl
#
# Copy to esphome/secrets.yaml and fill in — ESPHome resolves !secret from a
# secrets.yaml NEXT TO the config file (esphome/xphasectrl.yaml), not from
# the component root. secrets.yaml is GITIGNORED (m5stamp-pol-ctrl/.gitignore
# matches it at any depth) — never commit real credentials.

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# Station bus — the bw broker on scmino (mqtt-broker/). The device is a
# remote client and uses the broker's LAN address.
mqtt_password: "hf-account-password"

# OTA flash password
ota_password: "ota-password"

# Native API encryption key (ESPHome format: 32 base64 chars, one-time `esphome` key gen)
api_key: "REPLACE_WITH_ESPHOME_GENERATED_KEY=="

# web_server digest auth (LAN-reachable UI must not be wide open)
web_server_username: "admin"
web_server_password: "web-server-password"