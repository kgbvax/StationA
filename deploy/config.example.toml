# flex2mqtt example configuration.
# Copy to /etc/flex2mqtt/config.toml and edit. Sensitive values (MQTT
# password) can also be supplied via an EnvironmentFile; see install.sh.

# Radio connection. Leave radio_host empty to use UDP autodiscovery
# (recommended — works even if the radio's IP changes via DHCP). Set
# radio_serial to pick a specific radio if more than one is on the LAN.
radio_host = ""            # e.g. "192.168.1.50"; empty = discover
radio_serial = ""          # e.g. "1234-5678-8400.12345"; empty = first found
radio_udp_port = 4991      # local UDP port for the VITA-49 meter stream

[mqtt]
broker = "tcp://homeassistant.local:1883"
client_id = "flex2mqtt"
user = ""                  # set here or via FLEX2MQTT_MQTT_USER
password = ""              # set here or via FLEX2MQTT_MQTT_PASSWORD
discovery_prefix = "homeassistant"  # HA MQTT discovery prefix
state_prefix = "flex2mqtt"         # top-level topic prefix for state/meters

[log]
level = "info"             # debug | info | warn | error

# Per-meter-group minimum publish interval, in seconds. A meter whose value
# changes is published only after this long has elapsed AND the value differs
# by more than the unit deadband (duplicate removal). Lower = more responsive,
# higher = lighter broker/HA load.
[rates]
tx = 0.5      # forward/reflected power, SWR (2 Hz)
audio = 0.5   # compression, ALC, mic levels (2 Hz)
rx = 1.0      # S-meter, broadband per slice (1 Hz)
hw = 10.0     # PA temp, supply rails (0.1 Hz; radio polls these slowly)

# Optional EnvironmentFile overrides (systemd reads /etc/flex2mqtt/flex2mqtt.env):
#   FLEX2MQTT_MQTT_BROKER
#   FLEX2MQTT_MQTT_CLIENT_ID
#   FLEX2MQTT_MQTT_USER
#   FLEX2MQTT_MQTT_PASSWORD
#   FLEX2MQTT_RADIO_HOST
#   FLEX2MQTT_RADIO_SERIAL
#   FLEX2MQTT_RADIO_UDP_PORT
