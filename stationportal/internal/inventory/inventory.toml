# stationportal built-in inventory — the static half of the landing page.
# Versioned with the repo; a redeploy updates it. Facts as of 2026-10-02.
# The live half (device model/serial/firmware from /meta, liveness from /status
# and /state.device_online) comes from the bus and needs no entry here.

