# antenna-select reconciler — example configuration
#
# On the target this lives at /etc/antenna-select/config.toml (0600, owned by the
# service user); deploy.sh seeds it once. See
# ../docs/conventions/config-and-secrets.md.

# --- Deployment identity ------------------------------------------------------
# Facts about this deployment, published in /meta (integration model §3). Required.
location = "bauwagen"     # building
host     = "shari"        # compute node this service runs on

# --- MQTT -------------------------------------------------------------------
[mqtt]
broker    = "tcp://192.168.1.50:1883"
# client_id defaults to "<site>-<station>-<slot>" (model §8); set only to override.
site      = "muehle"
station   = "hf"
slot      = "antenna-select"
user      = "hf"
password  = ""            # set on the device; never on the command line

# --- Wiring map -------------------------------------------------------------
# The single editable place antenna arrangement lives (integration model §4).
# Maps switch ports to named PASSIVE resources. Devices never contain this.
[wiring_map]
p1  = "dummy-load"
p2  = "fan-dipole"    # 80/40 fan dipole on the HF mast (passive)
p3  = "ultrabeam"     # Ultrabeam — controlled by the ant-ctrl slot (see [band_follow])
# p4, p5 unused for now
off = "grounded"

# --- Band policy ------------------------------------------------------------
# Auto tier (3): resource -> the band names it serves. The reconciler resolves the
# resource to a port via [wiring_map]. Resource names must match wiring_map values.
[band_policy]
# Unmatched bands (incl. 160m — no resonant antenna assigned) route to the fallback
# resource. Decision (integration model §11 item #1): fan-dipole via the ATU.
# NOTE: 30/60/160m on the fan dipole are non-resonant — this assumes the ATU/tuner is
# engaged in-line (a `tuner` slot concern, model §10 residual).
fallback = "fan-dipole"

[band_policy.bands]
ultrabeam  = ["6m", "10m", "12m", "15m", "17m", "20m"]
fan-dipole = ["30m", "40m", "60m", "80m"]

# --- Priority ladder --------------------------------------------------------
# Fixed order (integration model §5); listed here for documentation only — the code
# enforces it. `mode` is derived (manual iff an operator hold is active).
#   1 idle     station.activity == inactive  -> off   (safe default; overrides all)
#   2 operator operator hold via /cmd         -> held selection
#   3 auto     band_policy(radio.band)         -> resolved port
[priority]
order = ["idle", "operator", "auto"]

# --- Soft band-follow (controller map) ---------------------------------------
# When `resource` is the selected antenna, drive its controller slot to track the radio
# frequency (integration model §4 controller map, §7.1). Which antenna follows the radio
# is site configuration, never code. Omit/empty `resource` to disable.
[band_follow]
resource = "ultrabeam"    # wiring_map resource to follow
slot     = "ant-ctrl"     # controller slot that receives {action: frequency} intents
