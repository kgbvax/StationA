; platformio.ini — M5Stack Chain DualKey Ultrabeam direction keys
; (m5dualkey-hf-antctrl). Consumer + /cmd stimulator for muehle/hf/ant-ctrl,
; not a slot. See README.md.
;
; Secrets live in gitignored include/secrets.h (copy from
; include/secrets.example.h.x).
;
; Wireless OTA is in the image (ArduinoOTA in src/main.cpp), so only the first
; flash (or recovery) needs USB. Routine updates: ./deploy.sh (OTA to
; m5dualkey-antctrl-1.local). First flash: ./deploy.sh usb.

[platformio]
default_envs = m5stack_chain_dualkey

[env:m5stack_chain_dualkey]
platform = espressif32
board = esp32-s3-devkitc-1  ; You can also use m5stack-stamps3
framework = arduino
; USB/serial first flash and recovery. ./deploy.sh usb passes the port
; explicitly (auto-detect on macOS picks the Bluetooth port).
upload_protocol = esptool
monitor_speed = 115200

; Configure for the ESP32-S3FN8 (8MB Flash)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB

; Enable USB CDC on boot so serial monitor works over the USB-C port
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Strongly recommended to use M5Stack's Unified Library
lib_deps =
    m5stack/M5Unified @ ^0.1.16
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.4
    adafruit/Adafruit NeoPixel @ ^1.15.2

[env:m5stack_chain_dualkey-ota]
; Over-the-air update. The firmware demands a password; deploy.sh exports it
; from include/secrets.h into DUALKEY_OTA_PASSWORD, so it never lands in this
; (checked-in) file or on a command line.
extends = env:m5stack_chain_dualkey
upload_protocol = espota
upload_port = m5dualkey-antctrl-1.local
upload_flags = --auth=${sysenv.DUALKEY_OTA_PASSWORD}
