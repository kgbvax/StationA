# ==========================================================
# station-at1 — 1:6 antenna switch, canonical ant-switch slot
#
# This ESPHome config IS the waveshare_relay-ant-switch-bridge: it publishes the canonical
# muehle/hf/ant-switch MQTT surface (meta/state/status/cmd) directly. It is
# a dumb actuator (integration model §5): it selects one of six ports (or
# off), reports what is selected, and reports when the relay has settled.
# Which antenna to select is decided by the antenna-select reconciler,
# never here. See docs/ant-switch-mqtt-api.md for the authoritative contract.
# ==========================================================

# ==========================================================
# Substitutions for easy configuration
# ==========================================================
substitutions:
  device_name: station-at1
  friendly_name: Antenna Select
  device_comment: "WaveShare ESP32-S3-POE-ETH-8DI-8DO Device (1:6 antenna switch)"

  # --- Station MQTT bus (see ../CLAUDE.md) ---
  mqtt_broker: "192.168.1.50"
  mqtt_port: "1883"
  mqtt_user: "hf"
  # mqtt_password comes from !secret mqtt_password (secrets file, gitignored).

  # --- Canonical slot addressing ---
  site: "muehle"
  station: "hf"
  slot: "ant-switch"

  # --- Conservative relay settle guard (cold-switch sequencing, §5) ---
  # Hold settled=false for this long after a commanded change before
  # publishing settled=true. Tunable; never publish settled=true optimistically.
  relay_settle_ms: "200"

# ==========================================================
# Core ESPHome Configuration
# ==========================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_comment}
  name_add_mac_suffix: false
  # On boot, sync the ESPHome time with the hardware RTC
  on_boot:
    priority: -100 # Run this early
    then:
      - pcf85063.read_time:
          id: pcf85063_time

# ==========================================================
# Board & Framework Configuration
# Module is ESP32-S3-WROOM-1U-N16R8 (16MB flash, 8MB PSRAM)
# ==========================================================
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_SPEED_80M: y

logger:
  level: WARN


# ==========================================================
# Network Configuration
# ==========================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# --- Ethernet (Disabled) ---
# To use Ethernet instead of Wi-Fi, uncomment this block and comment out the wifi block.
#ethernet:
#  type: W5500
#  clk_pin: GPIO15
#  mosi_pin: GPIO13
#  miso_pin: GPIO14
#  cs_pin: GPIO16
#  interrupt_pin: GPIO12

# ==========================================================
# API, OTA, and Web Server
# Home Assistant is a secondary consumer over the native API; the canonical
# surface is the MQTT bus below. Manual bring-up can use either.
# ==========================================================
api:
  # Add encryption and a password for security
  encryption:
    key: "5jh059h77vfI5eBHJ8Qa1X06biRAhYxZEjLhotyG5tY="

ota:
  - platform: esphome
    # Add a password for security
    # password: "Your_OTA_Password_Here"

web_server:
  port: 80

# ==========================================================
# I/O and Peripheral Buses
# ==========================================================
# --- I2C Bus for I/O Expander and RTC ---
i2c:
  scl: GPIO41
  sda: GPIO42

# --- RS485 Interface ---
uart:
  - id: rs485
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600

# ==========================================================
# On-board Components
# ==========================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        # Update the RTC when the synchronization was successful
        - pcf85063.write_time:
  - platform: pcf85063
    id: pcf85063_time

# --- I/O Expander for Relays ---
pca9554:
  - id: relais_1_8
    address: 0x20

# --- RGB LED ---
light:
  - platform: esp32_rmt_led_strip
    name: "RGB LED"
    pin: GPIO38
    chipset: ws2812
    num_leds: 1
    rgb_order: GRB # Required parameter for color order

# ==========================================================
# Outputs (Relays and Buzzer)
# ==========================================================
switch:
  # --- Mutually Exclusive Relays (3-8) → antenna ports port1..port6 ---
  - platform: gpio
    name: "Relay 3"
    id: relay_3
    internal: true # Hide from Home Assistant UI
    pin:
      pca9554: relais_1_8
      number: 2
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "Relay 4"
    id: relay_4
    internal: true
    pin:
      pca9554: relais_1_8
      number: 3
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "Relay 5"
    id: relay_5
    internal: true
    pin:
      pca9554: relais_1_8
      number: 4
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "Relay 6"
    id: relay_6
    internal: true
    pin:
      pca9554: relais_1_8
      number: 5
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "Relay 7"
    id: relay_7
    internal: true
    pin:
      pca9554: relais_1_8
      number: 6
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "Relay 8"
    id: relay_8
    internal: true
    pin:
      pca9554: relais_1_8
      number: 7
      mode:
        output: true
      inverted: false

  # --- Independent Relays (1-2) ---
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin:
      pca9554: relais_1_8
      number: 0
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin:
      pca9554: relais_1_8
      number: 1
      mode:
        output: true
      inverted: false

  # --- Buzzer (connected to a direct GPIO pin) ---
  - platform: gpio
    name: "Buzzer"
    pin: GPIO48
    inverted: true

# ==========================================================
# Inputs (with Pull-ups to prevent floating)
# ==========================================================
binary_sensor:
  - platform: gpio
    name: "Input 1"
    pin:
      number: GPIO47
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 2"
    pin:
      number: GPIO40
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 3"
    pin:
      number: GPIO39
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 4"
    pin:
      number: GPIO5
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 5"
    pin:
      number: GPIO6
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 6"
    pin:
      number: GPIO7
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 7"
    pin:
      number: GPIO1
      mode: {input: true, pullup: true}
  - platform: gpio
    name: "Input 8"
    pin:
      number: GPIO2
      mode: {input: true, pullup: true}

# ==========================================================
# Globals — bridge state
# ==========================================================
# settled is load-bearing for the reconciler's cold-switch sequencing
# (hot_switch: false). True only after the relay travel time has elapsed.
globals:
  - id: g_settled
    type: bool
    initial_value: 'true'

# ==========================================================
# Canonical MQTT bus — the ant-switch slot
# ==========================================================
# Manual topics only (discovery off, topic_prefix null): the bus carries
# exactly meta/state/status/cmd under ${site}/${station}/${slot}.
mqtt:
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_user}
  password: !secret mqtt_password
  client_id: ant-switch
  clean_session: false   # persistent session; retained /cmd redelivered on reconnect (self-heal)
  discovery: false       # HA is not an MQTT-discovery consumer; it uses the native api: above
  topic_prefix: null     # suppress all automatic per-entity topics

  # /status — liveness. online on (re)connect, offline via LWT on unclean
  # disconnect, offline via shutdown_message on clean shutdown.
  birth_message:
    topic: ${site}/${station}/${slot}/status
    payload: "online"
    qos: 1
    retain: true
  will_message:
    topic: ${site}/${station}/${slot}/status
    payload: "offline"
    qos: 1
    retain: true
  shutdown_message:
    topic: ${site}/${station}/${slot}/status
    payload: "offline"
    qos: 1
    retain: true

  # On connect: publish the birth certificate (/meta), then /state. /meta is
  # published via the publish_meta script (not inline) so the publish runs
  # through the same event loop path as publish_state — keeps the /meta
  # JSON byte-identical to /state's reference, and a small delay makes
  # the connect-time publish robust against reconnect-timing jitter.
  on_connect:
    - script.execute: publish_meta
    - script.execute: publish_state

  # /cmd — desired port. Retained by the commander; re-applied on reconnect.
  # The switch executes a select when it receives one; it does NOT gate on TX
  # state — cold-switch sequencing is the reconciler's responsibility (§6).
  on_json_message:
    topic: ${site}/${station}/${slot}/cmd
    qos: 1
    then:
      - lambda: |-
          std::string sel = x["select"].as<std::string>();
          int r = -1;
          if      (sel == "off") r = 0;
          else if (sel == "port1") r = 3;
          else if (sel == "port2") r = 4;
          else if (sel == "port3") r = 5;
          else if (sel == "port4") r = 6;
          else if (sel == "port5") r = 7;
          else if (sel == "port6") r = 8;
          if (r < 0) return;          // ignore unknown values; do not move relays
          id(select_relay).execute(r);

# ==========================================================
# Scripts
# ==========================================================
script:
  # publish_meta — retained birth certificate on /meta. Run from on_connect via
  # script.execute. The 100ms delay is a small jitter guard for the connect-time
  # publish window; the inline mqtt.publish form would also retain correctly
  # (the broker honors retain on PUBLISH once CONNACK is received), but routing
  # through this script keeps the /meta payload in one place if it ever needs
  # to be republished (e.g. on a meta schema bump).
  - id: publish_meta
    mode: single
    then:
      - delay: 100ms
      - mqtt.publish:
          topic: ${site}/${station}/${slot}/meta
          qos: 1
          retain: true
          payload: |-
            {"schema":"1.0","role":"ant-switch","device":{"model":"WaveShare ESP32-S3-POE-ETH-8DI-8DO (1:6 relay switch)"},"link":"wifi","location":"bauwagen","capabilities":{"ports":[1,2,3,4,5,6],"off":true,"exclusive":true,"hot_switch":false},"expose":{"device":{"name":"Antenna switch","model":"WaveShare ESP32-S3-POE-ETH-8DI-8DO (1:6 relay switch)"},"fields":[{"key":"selected","name":"Selected port","type":"enum","options":["off","port1","port2","port3","port4","port5","port6"],"writable":true,"command":{"value_key":"select","value_type":"string"}},{"key":"settled","name":"Settled","type":"boolean"}]}}

  # select_relay — the single command entry point. Driven by /cmd and by
  # the local select entity. Idempotent: if the target equals the current
  # relay position it does nothing (no relay chatter, settled stays true).
  # Otherwise moves the relay, marks settled=false, and arms the settle
  # timer. selected is derived from the relay group state (best-effort
  # readback — this hardware has no contact feedback; see the contract).
  - id: select_relay
    mode: single
    parameters:
      relay_number: int
    then:
      - lambda: |-
          // map relay_number -> target port
          std::string tgt = "off";
          if      (relay_number == 3) tgt = "port1";
          else if (relay_number == 4) tgt = "port2";
          else if (relay_number == 5) tgt = "port3";
          else if (relay_number == 6) tgt = "port4";
          else if (relay_number == 7) tgt = "port5";
          else if (relay_number == 8) tgt = "port6";
          // current selection from relay group state
          std::string cur = "off";
          if      (id(relay_3).state) cur = "port1";
          else if (id(relay_4).state) cur = "port2";
          else if (id(relay_5).state) cur = "port3";
          else if (id(relay_6).state) cur = "port4";
          else if (id(relay_7).state) cur = "port5";
          else if (id(relay_8).state) cur = "port6";
          if (cur == tgt) { id(publish_state).execute(); return; }  // idempotent
          // move: all off, then the selected one on
          id(relay_3).turn_off();
          id(relay_4).turn_off();
          id(relay_5).turn_off();
          id(relay_6).turn_off();
          id(relay_7).turn_off();
          id(relay_8).turn_off();
          if      (relay_number == 3) id(relay_3).turn_on();
          else if (relay_number == 4) id(relay_4).turn_on();
          else if (relay_number == 5) id(relay_5).turn_on();
          else if (relay_number == 6) id(relay_6).turn_on();
          else if (relay_number == 7) id(relay_7).turn_on();
          else if (relay_number == 8) id(relay_8).turn_on();
          id(g_settled) = false;
          id(settle_timer).execute();
          id(publish_state).execute();

  # settle_timer — re-armed on each new command (mode: restart). After the
  # worst-case travel time, mark settled=true and publish.
  - id: settle_timer
    mode: restart
    then:
      - delay: ${relay_settle_ms}ms
      - lambda: |-
          id(g_settled) = true;
          id(publish_state).execute();

  # publish_state — retained JSON snapshot on /state. selected is read from
  # the relay group (not echoed from the command).
  - id: publish_state
    mode: single
    then:
      - mqtt.publish_json:
          topic: ${site}/${station}/${slot}/state
          retain: true
          qos: 1
          payload: |-
            std::string sel = "off";
            if      (id(relay_3).state) sel = "port1";
            else if (id(relay_4).state) sel = "port2";
            else if (id(relay_5).state) sel = "port3";
            else if (id(relay_6).state) sel = "port4";
            else if (id(relay_7).state) sel = "port5";
            else if (id(relay_8).state) sel = "port6";
            root["ts"] = id(ha_time).now().strftime("%Y-%m-%dT%H:%M:%SZ");
            root["selected"] = sel;
            root["settled"] = id(g_settled);

# ==========================================================
# Select Entity for Relay Control (visible in Home Assistant)
# Local/HA manual surface using contract vocabulary. Drives select_relay,
# same path as /cmd. Does not touch MQTT (topic_prefix: null).
# ==========================================================
select:
  - platform: template
    name: "Antenna Port"
    id: relay_selection
    optimistic: false
    options:
      - "off"
      - "port1"
      - "port2"
      - "port3"
      - "port4"
      - "port5"
      - "port6"
    set_action:
      - if:
          condition:
            lambda: 'return x == "off";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 0
      - if:
          condition:
            lambda: 'return x == "port1";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 3
      - if:
          condition:
            lambda: 'return x == "port2";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 4
      - if:
          condition:
            lambda: 'return x == "port3";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 5
      - if:
          condition:
            lambda: 'return x == "port4";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 6
      - if:
          condition:
            lambda: 'return x == "port5";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 7
      - if:
          condition:
            lambda: 'return x == "port6";'
          then:
            - script.execute:
                id: select_relay
                relay_number: 8
    lambda: |-
      if (id(relay_3).state) return std::string("port1");
      if (id(relay_4).state) return std::string("port2");
      if (id(relay_5).state) return std::string("port3");
      if (id(relay_6).state) return std::string("port4");
      if (id(relay_7).state) return std::string("port5");
      if (id(relay_8).state) return std::string("port6");
      return std::string("off");